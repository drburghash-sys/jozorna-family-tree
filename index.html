/* إصدار ٢: حجم قراءة كبير، ونمطان لعرض الأنساب */
:root {--read-scale:1.38;--tree-card-w:292px;--tree-card-h:124px}

// ----- شجرة تفاعلية قابلة للتكبير والتحريك -----
// Each household is laid out as a compact unit. Parents who share children
// belong to the same unit even when their recorded ancestry comes from different roots.
function layoutPeople(){
 const byId=Object.fromEntries(people.map(p=>[p.id,p]));
 const ids=people.map(p=>p.id),parentById={};
 for(const p of people)parentById[p.id]=[p.father_id,p.mother_id].filter(id=>id&&byId[id]&&id!==p.id);
 // Marriage groups represent one physical location per individual. A link
 // inferred from common children counts as a couple, not a sibling relation.
 const spouseLinks=new Map();
 function couple(a,b){if(!a||!b||a===b||!byId[a]||!byId[b])return;let pair=[a,b].sort();spouseLinks.set(pair.join('|'),pair)}
 for(const p of people){for(const id of p.spouse_ids||[])couple(p.id,id)}
 for(const p of people)if(p.father_id&&p.mother_id)couple(p.father_id,p.mother_id);
 const uf=Object.fromEntries(ids.map(id=>[id,id]));
 function find(a){if(!uf[a])return null;while(uf[a]!==a){uf[a]=uf[uf[a]];a=uf[a]}return a}
 function union(a,b){a=find(a);b=find(b);if(a&&b&&a!==b)uf[b]=a}
 for(const [a,b] of spouseLinks.values())union(a,b);
 const units={},unitOf={};
 for(const p of people){let u=find(p.id);(units[u]??=[]).push(p);unitOf[p.id]=u}
 const unitIds=Object.keys(units);
 const parentUnits={},parentsOfUnit={};
 for(const uid of unitIds){parentUnits[uid]=new Map();parentsOfUnit[uid]=new Set()}
 for(const p of people){
  const uid=unitOf[p.id];for(const pid of parentById[p.id]){
   const parentUnit=unitOf[pid];if(parentUnit===uid)continue;
   parentsOfUnit[uid].add(parentUnit);
   const group=parentUnits[parentUnit];
   if(!group.has(uid))group.set(uid,[]);
   if(!group.get(uid).includes(p.id))group.get(uid).push(p.id);
  }
 }
 const depthMemo={};
 function depth(id,seen=new Set()){if(!id||!byId[id]||seen.has(id))return 0;if(depthMemo[id]!==undefined)return depthMemo[id];seen.add(id);let pars=parentById[id];return depthMemo[id]=pars.length?Math.max(...pars.map(x=>depth(x,new Set(seen))))+1:0}
 for(const id of ids)depth(id);
 // A household inherits its position from one ancestral household. The
 // strongest candidate is the one with most linked children, then the one
 // with the largest known ancestral chain. Other ancestry is retained as
 // a secondary botanical connector, never confused with a marriage.
 const primary={},otherParents={};
 for(const uid of unitIds){
  const candidates=[...parentsOfUnit[uid]].map(pu=>{
   const targetPeople=units[uid].filter(p=>parentById[p.id].some(id=>unitOf[id]===pu));
   const ancestorCount=units[pu].reduce((s,p)=>s+parentById[p.id].length,0);
   const childCount=targetPeople.length;
   const sourceDepth=Math.max(...units[pu].map(p=>depthMemo[p.id]||0));
   return {pu,score:childCount*100+ancestorCount*7+sourceDepth*2};
  }).sort((a,b)=>b.score-a.score||a.pu.localeCompare(b.pu));
  primary[uid]=candidates[0]?.pu||null;
  otherParents[uid]=candidates.slice(1).map(x=>x.pu);
 }
 // Break loops caused by accidentally cyclic input instead of hanging.
 function createsCycle(uid){let seen=new Set([uid]),p=primary[uid];while(p){if(seen.has(p))return true;seen.add(p);p=primary[p]}return false}
 for(const uid of unitIds)if(createsCycle(uid))primary[uid]=null;
 const childrenOf={};for(const uid of unitIds)childrenOf[uid]=[];
 for(const uid of unitIds)if(primary[uid])childrenOf[primary[uid]].push(uid);
 const W=Math.round((treeStyle==='botanical'?286:255)*treeTextScale/1.18);
 const H=Math.round((treeStyle==='botanical'?132:111)*treeTextScale/1.18);
 const marriedGap=Math.max(22,Math.round(44*treeTextScale));
 const siblingGap=Math.max(48,Math.round(74*treeTextScale));
 const forestGap=Math.max(110,Math.round(210*treeTextScale));
 const VG=Math.round((treeStyle==='botanical'?218:188)*treeTextScale/1.23);
 const sortMembers=uid=>{
  const list=[...units[uid]];
  const coupled=new Set();
  // Keep partners next to one another even if multiple spouses are present.
  const adjacency={};for(const p of list)adjacency[p.id]=[];
  for(const [a,b] of spouseLinks.values())if(unitOf[a]===uid&&unitOf[b]===uid){adjacency[a].push(b);adjacency[b].push(a)}
  const center=list.slice().sort((a,b)=>(adjacency[b.id].length-adjacency[a.id].length)||
    (parentById[b.id].length-parentById[a.id].length)||a.name.localeCompare(b.name,'ar'))[0];
  let result=[];
  function traverse(id){if(coupled.has(id))return;coupled.add(id);result.push(byId[id]);for(const peer of adjacency[id]||[])traverse(peer)}
  if(center && adjacency[center.id]?.length===2 && list.length===3){
   const [first,second]=adjacency[center.id];
   result=[byId[first],byId[center.id],byId[second]];
   result.forEach(p=>coupled.add(p.id));
  }else if(center)traverse(center.id);
  for(const p of list)traverse(p.id);
  return result;
 };
 const memberOrder={};for(const id of unitIds)memberOrder[id]=sortMembers(id);
 const ownWidth=uid=>memberOrder[uid].length*W+Math.max(0,memberOrder[uid].length-1)*marriedGap;
 const sizes={};
 function measure(uid,ancestors=new Set()){
  if(sizes[uid]!==undefined)return sizes[uid];
  if(ancestors.has(uid))return ownWidth(uid);
  ancestors.add(uid);
  const kids=childrenOf[uid];
  const kidsWidth=kids.length?kids.reduce((sum,k)=>sum+measure(k,new Set(ancestors)),0)+(kids.length-1)*siblingGap:0;
  return sizes[uid]=Math.max(ownWidth(uid),kidsWidth);
 }
 for(const id of unitIds)measure(id);
 const roots=unitIds.filter(uid=>!primary[uid]);
 const rootSort=(a,b)=>{
  const ad=Math.min(...units[a].map(p=>depthMemo[p.id]||0));
  const bd=Math.min(...units[b].map(p=>depthMemo[p.id]||0));
  return ad-bd||a.localeCompare(b);
 };
 roots.sort(rootSort);
 // Keep an affinal root close to the lineage whose descendant married it.
 const rootConnections={};for(const id of roots)rootConnections[id]=new Set();
 const rootOf=uid=>{let guard=new Set(),v=uid;while(primary[v]&&!guard.has(v)){guard.add(v);v=primary[v]}return v};
 for(const uid of unitIds)for(const alt of otherParents[uid]){let a=rootOf(uid),b=rootOf(alt);if(a!==b&&rootConnections[a]&&rootConnections[b]){rootConnections[a].add(b);rootConnections[b].add(a)}}
 const ordered=[],visitedRoots=new Set();
 function walkRoots(r){if(visitedRoots.has(r))return;visitedRoots.add(r);ordered.push(r);for(const other of [...rootConnections[r]].sort())walkRoots(other)}
 for(const r of roots)walkRoots(r);
 const loc={},unitCenters={},unitOrigins={},placed=new Set();let maxLevel=0,nextX=75;
 function place(uid,level,left){
  if(placed.has(uid))return;placed.add(uid);maxLevel=Math.max(level,maxLevel);
  const size=sizes[uid],own=ownWidth(uid),start=left+(size-own)/2;
  memberOrder[uid].forEach((p,i)=>loc[p.id]={x:start+i*(W+marriedGap),y:60+level*VG,level,unit:uid});
  const center=start+own/2;
  unitCenters[uid]={x:center,y:60+level*VG,level};
  unitOrigins[uid]={x:start,y:60+level*VG,width:own};
  const kids=childrenOf[uid];
  if(kids.length){const width=kids.reduce((s,k)=>s+sizes[k],0)+(kids.length-1)*siblingGap;
   let cur=left+(size-width)/2;
   for(const kid of kids){place(kid,level+1,cur);cur+=sizes[kid]+siblingGap}
  }
 }
 for(const root of ordered){if(placed.has(root))continue;place(root,0,nextX);nextX+=sizes[root]+forestGap}
 for(const uid of unitIds)if(!placed.has(uid)){place(uid,0,nextX);nextX+=sizes[uid]+forestGap}
 if(treeStyle==='botanical'){
  for(const v of Object.values(loc))v.y=60+(maxLevel-v.level)*VG;
  for(const v of Object.values(unitCenters))v.y=60+(maxLevel-v.level)*VG;
  for(const v of Object.values(unitOrigins))v.y=60+(maxLevel-(v.y-60)/VG)*VG;
 }
 const totalW=Math.max(750,nextX+40),totalH=Math.max(560,(maxLevel+1)*VG+H+(treeStyle==='botanical'?190:90));
 return {byId,loc,unitOf,units,unitIds,memberOrder,unitCenters,unitOrigins,childrenOf,primary,otherParents,spouseLinks:[...spouseLinks.values()],W,H,totalW,totalH,roots,maxLevel,depthMemo};
}
function treeEdges(l){
 const edges=[];
 for(const [a,b] of l.spouseLinks){
  const x=l.loc[a],y=l.loc[b];if(x&&y)edges.push({type:'couple',from:x,to:y,a,b});
 }
 // Each household is attached exactly once to its primary parent household.
 for(const uid of l.unitIds){const pu=l.primary[uid];if(!pu)continue;
  const parents=l.units[pu].filter(p=>l.units[uid].some(child=>[child.father_id,child.mother_id].includes(p.id)));
  const from=parents.length?parents.map(p=>l.loc[p.id].x+l.W/2).reduce((a,b)=>a+b,0)/parents.length:l.unitCenters[pu].x;
  const to=l.unitCenters[uid];
  if(to)edges.push({type:'branch',from:{x:from,y:l.unitCenters[pu].y},to});
 }
 // Distinct known ancestry on the other partner is shown as a subtle vine,
 // never as a dotted spouse line. One person is never duplicated.
 for(const uid of l.unitIds)for(const alt of l.otherParents[uid]){
  const source=l.unitCenters[alt],target=l.unitCenters[uid];
  if(source&&target&&alt!==l.primary[uid])edges.push({type:'secondary',from:source,to:target});
 }
 return edges;
}
function edgePath(e,l,bot){
 const H=l.H;
 if(e.type==='couple'){
  const left=e.from.x<e.to.x?e.from:e.to,right=e.from.x<e.to.x?e.to:e.from;
  if(Math.abs(left.y-right.y)>1)return '';
  const y=left.y+H*.50;
  return `M${left.x+l.W*.88} ${y} Q${(left.x+right.x+l.W)/2} ${y+4} ${right.x+l.W*.12} ${y}`;
 }
 const startX=e.from.x,endX=e.to.x;
 const startY=bot?e.from.y+H*.10:e.from.y+H*.90;
 const endY=bot?e.to.y+H*.90:e.to.y+H*.10;
 const dy=endY-startY;
 // smooth natural branch, without a rectangular bus or sharp horizontal line
 return `M${startX} ${startY} C${startX} ${startY+dy*.39} ${endX} ${endY-dy*.40} ${endX} ${endY}`;
}
function treeBackgroundSVG(l){

 }).join('')}</g>`}
 const def=`<defs><linearGradient id="skyGradient" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#eff7ec"/><stop offset=".65" stop-color="#f9f7df"/><stop offset="1" stop-color="#efe9cc"/></linearGradient><linearGradient id="trunkGradient" x1="0" x2="1"><stop stop-color="#523a25"/><stop offset=".36" stop-color="#9c7446"/><stop offset=".75" stop-color="#795432"/><stop offset="1" stop-color="#42311f"/></linearGradient><radialGradient id="canopyGradient"><stop stop-color="#91bf5e" stop-opacity=".35"/><stop offset="1" stop-color="#b8d783" stop-opacity=".02"/></radialGradient><linearGradient id="hillsGradient" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#c4d69b" stop-opacity=".6"/><stop offset="1" stop-color="#95b47b" stop-opacity=".75"/></linearGradient></defs>`;
 let layer=`${def}<rect width="${w}" height="${h}" fill="url(#skyGradient)"/><path d="M0 ${h-42}Q${w*.26} ${h-104} ${w*.48} ${h-56}T${w} ${h-50}V${h}H0Z" fill="url(#hillsGradient)"/>`;
 // ظلال التاج فوق الجذع، وتظل البطاقات مقروءة فوقها.
 const canopyTop=24,canopyBottom=h-130;
 for(let i=0;i<Math.min(people.length*2+15,90);i++){
 let x=75+(i*157.37%Math.max(1,w-150)),y=canopyTop+(i*111.17%Math.max(1,canopyBottom-canopyTop));
 let radius=115+(i*23%75);layer+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${radius}" ry="${(radius*.72).toFixed(0)}" fill="url(#canopyGradient)"/>`;
 }
 for(const root of l.roots){
  const z=l.unitCenters[root];if(!z)continue;
  const x=z.x,top=z.y+l.H*.40,bottom=h-43;
  layer+=`<path d="M${x} ${bottom+8} C${x-14} ${bottom-70} ${x+12} ${top+55} ${x} ${top}" fill="none" stroke="#483220" stroke-width="35" stroke-linecap="round" opacity=".16"/>`;
  layer+=`<path d="M${x} ${bottom+8} C${x-14} ${bottom-70} ${x+12} ${top+55} ${x} ${top}" fill="none" stroke="url(#trunkGradient)" stroke-width="24" stroke-linecap="round"/>`;
  layer+=`<path d="M${x} ${bottom-25} q-44 23 -67 28 M${x} ${bottom-28} q48 26 71 25" stroke="#795637" stroke-width="10" stroke-linecap="round" fill="none"/>`;
  layer+=`<path d="M${x-5} ${bottom-40} C${x-18} ${bottom-74} ${x-1} ${top+70} ${x} ${top+12}" stroke="#bb9967" stroke-width="3.6" fill="none" opacity=".63"/>`;

 closeModal();treeView.fit=false;render();toast(old?'تم تحديث بيانات الشخص':'أُضيف الاسم إلى شجرة العائلة');

function renderFeed(type){let isMemory=type==='memory',filtered=posts.filter(p=>p.type===type).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('content').innerHTML=`<section class="hero"><div><h2>${isMemory?'صندوق الذكريات':'مجلس العائلة'}</h2><p>${isMemory?'احفظوا صورًا ومواقف وقصصًا عن الماضي.':'مساحة خاصة لرسائل أفراد العائلة وتواصلهم.'}</p></div><div class="hero-actions"><button class="btn light" onclick="app.goto('tree')">🌳 عرض الشجرة</button></div></section><section class="surface" style="margin-top:18px"><div class="surface-header"><h3>${isMemory?'الألبوم العائلي':'آخر الرسائل'}</h3><span class="chip">${filtered.length} ${isMemory?'ذكرى':'مشاركة'}</span></div><div class="feed"><form class="composer" onsubmit="app.publish(event,'${type}')"><strong>${isMemory?'أضف ذكرى جديدة':'اكتب رسالة للعائلة'}</strong><textarea id="postBody" class="field" required maxlength="5000" placeholder="${isMemory?'ما القصة وراء هذه الذكرى؟':'اكتب رسالتك هنا...'}"></textarea>${isMemory?`<div class="form-grid"><div class="form-row"><label>السنة أو المناسبة</label><input id="postDate" class="field" maxlength="90" placeholder="مثل عيد ١٤٣٠ هـ"></div><div class="form-row"><label>اربط الذكرى بشخص</label><select id="postPerson" class="field"><option value="">بدون ربط</option>${people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div></div><div class="form-row"><label>صورة الذكرى (اختياري)</label><input type="file" accept="image/*" id="postImage" class="field"></div>`:''}<div class="composer-foot"><small class="muted">${mode==='cloud'?'تظهر المشاركة لدى أعضاء العائلة المعتمدين.':'تُحفظ على هذا الجهاز حاليًا.'}</small><button class="btn" type="submit">${isMemory?'حفظ الذكرى':'نشر الرسالة'}</button></div></form>${filtered.length?filtered.map(p=>`<article class="post"><div class="post-head"><div class="person-avatar">${esc((p.author_name||'ع')[0])}</div><div><b>${esc(p.author_name)}</b><div class="muted">${new Date(p.created_at).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'})}</div></div><div style="flex:1"></div>${(isAdmin()||mode==='cloud'&&p.author_id===session?.user?.id||mode==='local')?`<button class="btn small danger" onclick="app.deletePost('${esc(p.id)}')">حذف</button>`:''}</div><div class="post-body">${esc(p.body)}</div>${p.image?`<img class="post-photo" src="${esc(p.image)}" alt="صورة ذكرى">`:''}<div class="post-foot"><span>${p.memory_date?'📅 '+esc(p.memory_date):''}</span><span>${p.person_id?'مرتبط بـ '+esc(relationName(p.person_id)):''}</span></div></article>`).join(''):`<div class="empty"><div style="font-size:42px">${isMemory?'▣':'☏'}</div><b>${isMemory?'لا توجد ذكريات بعد':'المجلس هادئ الآن'}</b>ابدأ أول مشاركة للعائلة.</div>`}</div></section>`}
async function publish(ev,type){ev.preventDefault();let body=$('postBody')?.value?.trim();if(!body)return toast('أدخل النص أولًا',true);let image='';try{if(type==='memory'&&$('postImage')?.files?.length)image=await readImage($('postImage').files[0],680);let item={id:uid(),type,body,image,person_id:type==='memory'?$('postPerson')?.value||null:null,memory_date:type==='memory'?$('postDate')?.value?.trim()||'':'',author_name:currentName(),created_at:new Date().toISOString()};if(mode==='cloud'){const{error}=await sb.from('family_posts').insert({...item,family_id:family.id,author_id:session.user.id});if(error)throw error;await reloadCloud()}else{posts.unshift(item);saveLocal()}render();toast('تمت إضافة المشاركة')}catch(e){toast('تعذر نشر المشاركة: '+e.message,true)}}
async function deletePost(id){if(!confirm('هل تريد حذف هذه المشاركة نهائيًا؟'))return;try{if(mode==='cloud'){let{error}=await sb.from('family_posts').delete().eq('id',id).eq('family_id',family.id);if(error)throw error;await reloadCloud()}else{posts=posts.filter(p=>p.id!==id);saveLocal()}render();toast('حُذفت المشاركة')}catch(e){toast(e.message,true)}}

function renderAdmin(){let shared=mode==='cloud'&&family&&membership?.status==='approved',pending=members.filter(m=>m.status==='pending');$('content').innerHTML=`<section class="hero"><div><h2>إدارة شجرة العائلة</h2><p>احتفظ بالنسخ الاحتياطية وادعُ أفراد العائلة للتعديل المشترك.</p></div><div class="hero-actions"><button class="btn light" onclick="app.exportJSON()">⬇ نسخة احتياطية</button></div></section><div class="two-cols" style="margin-top:18px"><section class="surface info-card"><h3>☁ المزامنة بين الأجهزة</h3>${shared?`<p>الشجرة متصلة بالسحابة. لا يطّلع على بياناتها سوى الأعضاء المعتمدين.</p><div class="form-row"><label>رمز دعوة العائلة (للدخول وطلب الموافقة)</label><div style="display:flex;gap:8px"><input class="field" style="flex:1;min-width:0;direction:ltr;text-align:center;letter-spacing:2px" readonly value="${esc(family.invite_code)}"><button class="btn outline" onclick="app.copyCode()">نسخ</button></div></div><p class="hint">أرسل رمز الدعوة للعائلة فقط. العضو الجديد يطلب الانضمام، ويوافق المدير قبل أن يرى البيانات.</p><p>اسم حسابك: <b>${esc(currentName())}</b> · ${isAdmin()?'مدير':'عضو'}</p><button class="btn outline" onclick="app.logout()">تسجيل الخروج</button>`:`<p>يمكنك استخدام الشجرة مجانًا على هذا الجهاز. ولجعل عدة أشخاص يدخلون ويضيفون أسماء، يلزم ربطها بقاعدة بيانات سحابية مجانية.</p><div class="warning">لا تُعدّ المزامنة فعالة قبل إنشاء مشروع Supabase وربطه بالملف. لا ترفع بيانات عائلية خاصة إلى موقع عام.</div><div style="margin-top:15px"><button class="btn" onclick="app.cloudSettings()">⚙ إعداد الاتصال والمزامنة</button></div>`}</section><section class="surface info-card"><h3>💾 حفظ البيانات وإدارتها</h3>${isAdmin()?`<div class="form-row" style="margin-bottom:16px"><label>اسم العائلة</label><div class="tools"><input class="field" id="renameFamily" value="${esc(family?.name||local.name)}"><button class="btn small" onclick="app.renameFamily()">حفظ الاسم</button></div></div>`:''}<p>صدّر ملف JSON لتتمكن من استعادة أسماء العائلة وروابطها وذكرياتها عند تبديل الجهاز. الاستيراد يستبدل البيانات المحلية فقط.</p><div class="tools"><button class="btn outline" onclick="app.exportJSON()">تنزيل نسخة</button><label class="btn outline" style="cursor:pointer">استيراد نسخة<input type="file" hidden accept=".json,application/json" onchange="app.importJSON(this.files[0])"></label></div>${mode==='local'?`<div style="border-top:1px solid #e3eae2;margin-top:17px;padding-top:15px"><button class="btn danger" onclick="app.resetTree()">🗑 ابدأ شجرة فارغة</button></div>`:''}${shared&&isAdmin()?`<div style="border-top:1px solid #e3eae2;margin-top:17px;padding-top:15px"><p>لديك بيانات محلية وتريد نقلها إلى الشجرة السحابية؟ تأكد أولًا أنك لا ترفع أشخاصًا تجريبيين.</p><button class="btn outline" onclick="app.uploadLocal()">رفع نسخة الجهاز للسحابة</button></div>`:''}</section></div>${shared?`<section class="surface info-card" style="margin-top:17px"><h3>👥 أعضاء العائلة وطلبات الانضمام</h3>${isAdmin()&&pending.length?`<div class="warning">لديك ${pending.length} طلب انضمام بانتظار الموافقة.</div>`:''}${members.length?members.map(m=>`<div class="member"><div><b>${esc(m.display_name)}</b> <span class="chip ${m.status==='pending'?'pending':''}">${m.role==='admin'?'مدير':m.status==='pending'?'ينتظر الموافقة':'عضو'}</span><div class="muted">${new Date(m.joined_at).toLocaleDateString('ar-SA')}</div></div><div class="tools">${isAdmin()&&m.status==='pending'?`<button class="btn small" onclick="app.approve('${esc(m.user_id)}')">✓ موافقة</button><button class="btn small danger" onclick="app.reject('${esc(m.user_id)}')">رفض</button>`:''}</div></div>`).join(''):'<p class="muted">لا توجد عضويات بعد.</p>'}</section>`:''}<div class="page-note">تنبيه: النسخ المحلية لا تتزامن تلقائيًا، وعند تفعيل الحساب السحابي يجب رفع البيانات المطلوبة إلى السحابة صراحة.</div>`}
async function renameFamily(){let name=$('renameFamily')?.value.trim();if(!name||name.length<2||name.length>100)return toast('أدخل اسمًا صحيحًا للعائلة',true);try{if(mode==='cloud'){if(!isAdmin())throw Error('يجب أن تكون مدير العائلة');let{error}=await sb.from('family_trees').update({name}).eq('id',family.id);if(error)throw error;family.name=name}else{local.name=name;saveLocal()}render();toast('تم تحديث اسم العائلة')}catch(e){toast(e.message,true)}}
function exportJSON(){let data={format:'jozorna-family-tree',version:1,exported_at:new Date().toISOString(),name:family?.name||local.name,people,posts};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),'jozorna-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('تم تجهيز ملف النسخة الاحتياطية')}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importJSON(file){if(!file)return;try{let data=JSON.parse(await file.text());if(data.format!=='jozorna-family-tree'||!Array.isArray(data.people)||!Array.isArray(data.posts))throw Error('الملف ليس نسخة صحيحة من برنامج جذورنا');if(data.people.length>2000)throw Error('النسخة تحتوي عددًا أكبر من الحد المسموح (٢٠٠٠ شخص)');if(data.people.some(p=>!isValidId(p.id)||!['male','female'].includes(p.gender)||typeof p.name!=='string'))throw Error('بيانات الأشخاص غير صالحة');if(data.posts.some(p=>!isValidId(p.id)||!['message','memory'].includes(p.type)))throw Error('بيانات المشاركات غير صالحة');if(!confirm('سيُستبدل محتوى النسخة المحلية فقط. هل تريد الاستمرار؟'))return;local={name:String(data.name||'عائلتي').slice(0,100),people:data.people,posts:data.posts,settings:{}};localStorage.setItem(LS,JSON.stringify(local));if(mode==='local'){people=clone(local.people);posts=clone(local.posts);treeView.fit=false;render()}toast('تم استيراد النسخة المحلية')}catch(e){toast('تعذر الاستيراد: '+e.message,true)}}
function isValidId(id){return typeof id==='string'&&/^[\w-]{1,100}$/.test(id)}
function resetTree(){if(!confirm('سيتم حذف بيانات الشجرة المحلية والمشاركات من هذا الجهاز. لا يمكن التراجع دون نسخة احتياطية. هل تؤكد؟'))return;local={name:'شجرة عائلتي',people:[],posts:[],settings:{}};people=[];posts=[];saveLocal();treeView.fit=false;render();toast('أصبحت الشجرة فارغة وجاهزة للبناء')}

function cloudSettings(){modal('ربط المزامنة',`<div class="setup"><div class="warning"><b>مرة واحدة:</b> أنشئ مشروعًا مجانيًا على Supabase، وانسخ ملف <b>supabase_schema.sql</b> إلى SQL Editor وشغّله. ثم أدخل رابط المشروع والمفتاح العام <b>publishable/anon</b>، لا مفتاح service_role السري.</div><div class="form-row"><label>Project URL</label><input id="cloudURL" class="field" dir="ltr" placeholder="https://xxxx.supabase.co" value="${esc(config.url||'')}"></div><div class="form-row"><label>Publishable / anon key (مفتاح عام)</label><input id="cloudKEY" class="field" dir="ltr" placeholder="sb_publishable_... / eyJ..." value="${esc(config.key||'')}"></div><div class="hint">بعد الربط يمكن إنشاء شجرة أو إدخال رمز دعوة. الأعضاء يحتاجون بريدًا إلكترونيًا وكلمة مرور، ويوافق المدير عليهم قبل المشاركة.</div></div>`,`<button class="btn outline" onclick="app.closeModal()">إلغاء</button><button class="btn" onclick="app.connectCloud()">الاتصال بالسحابة</button>`)}
async function connectCloud(){let url=$('cloudURL').value.trim().replace(/\/$/,''),key=$('cloudKEY').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||key.length<20)return toast('تحقق من رابط Supabase والمفتاح العام',true);if(!window.supabase?.createClient)return toast('مكتبة الاتصال غير محمّلة؛ افتح الملف مع الإنترنت',true);try{config={url,key};localStorage.setItem(CFG,JSON.stringify(config));sb=window.supabase.createClient(url,key);mode='cloud';let a=await sb.auth.getSession();session=a.data.session;closeModal();await cloudEntry();toast('تم ضبط الاتصال. أكمل تسجيل الدخول أو إنشاء حساب.') }catch(e){toast('تعذر الاتصال: '+e.message,true)}}

async function authSubmit(e,kind){e.preventDefault();let email=$('email').value.trim(),password=$('password').value;try{let result=kind==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(kind==='signup'&&!result.data.session){toast('أُنشئ الحساب. راجع بريدك الإلكتروني لتأكيده ثم سجّل الدخول.');loginTab='signin';renderAccount();return}session=result.data.session;await cloudEntry();toast('تم تسجيل الدخول بنجاح')}catch(err){toast(err.message,true)}}

async function checkMembership(showToast=true){if(!session||!sb)return;try{let{data,error}=await sb.from('family_members').select('*').eq('user_id',session.user.id).order('joined_at',{ascending:false});if(error)throw error;membership=data?.find(m=>m.status==='approved')||data?.[0]||null;if(!membership){family=null;people=[];posts=[];render();return}if(membership.status!=='approved'){family=null;people=[];posts=[];render();if(showToast)toast('لا تزال الموافقة معلقة');return}let fr=await sb.from('family_trees').select('*').eq('id',membership.family_id).single();if(fr.error)throw fr.error;family=fr.data;await reloadCloud();listenCloud();render();if(showToast)toast('الشجرة محدثة')}catch(e){toast('تعذر تحميل العضوية: '+e.message,true)}}
async function createFamily(){let name=$('newFamilyName')?.value.trim(),display=$('newMemberName')?.value.trim()||'مدير الشجرة';if(!name||name.length<2)return toast('أدخل اسم العائلة',true);try{let{error}=await sb.rpc('create_family_tree',{p_name:name,p_display_name:display});if(error)throw error;closeModal();await checkMembership(false);toast('تم إنشاء الشجرة. شارك رمز الدعوة مع عائلتك من صفحة الإدارة.')}catch(e){toast('تعذر إنشاء الشجرة: '+e.message,true)}}
async function joinFamily(){let code=$('joinCode')?.value.trim(),name=$('joinDisplayName')?.value.trim();if(!code||!name)return toast('أدخل الرمز واسمك',true);try{let{error}=await sb.rpc('join_family_tree',{p_code:code,p_display_name:name});if(error)throw error;closeModal();await checkMembership(false);toast('أُرسل الطلب إلى مدير العائلة')}catch(e){toast('تعذر الانضمام: '+e.message,true)}}
async function reloadCloud(){if(!family||!session||mode!=='cloud')return;let [a,b,c]=await Promise.all([sb.from('family_people').select('*').eq('family_id',family.id).order('created_at',{ascending:true}).limit(2000),sb.from('family_posts').select('*').eq('family_id',family.id).order('created_at',{ascending:false}).limit(500),sb.from('family_members').select('*').eq('family_id',family.id)]);if(a.error||b.error||c.error)throw a.error||b.error||c.error;people=(a.data||[]).filter(p=>isValidId(p.id));posts=(b.data||[]).filter(p=>isValidId(p.id));members=c.data||[];}
async function writePerson(p){let data={id:p.id,family_id:family.id,name:p.name,gender:p.gender,father_id:p.father_id||null,mother_id:p.mother_id||null,spouse_ids:p.spouse_ids||[],birth_year:p.birth_year||'',death_year:p.death_year||'',city:p.city||'',bio:p.bio||'',image:p.image||'',created_by:p.created_by||session.user.id};let existing=people.some(x=>x.id===p.id);let result;if(existing){const {created_by,...edit}=data;result=await sb.from('family_people').update(edit).eq('id',p.id).eq('family_id',family.id)}else{result=await sb.from('family_people').insert(data)}if(result.error)throw result.error}
function listenCloud(){if(!family||!sb)return;if(realtime)sb.removeChannel(realtime);realtime=sb.channel('family-'+family.id).on('postgres_changes',{event:'*',schema:'public',table:'family_people',filter:'family_id=eq.'+family.id},()=>refreshBackground()).on('postgres_changes',{event:'*',schema:'public',table:'family_posts',filter:'family_id=eq.'+family.id},()=>refreshBackground()).on('postgres_changes',{event:'*',schema:'public',table:'family_members',filter:'family_id=eq.'+family.id},()=>refreshBackground()).subscribe();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>{if(mode==='cloud'&&session)refreshBackground()},30000)}
let refreshing=false;async function refreshBackground(){if(refreshing||mode!=='cloud'||!family||document.querySelector('.modal-wrap'))return;refreshing=true;try{await reloadCloud();render()}catch(e){console.warn(e.message)}finally{refreshing=false}}
async function approve(id){try{let{error}=await sb.from('family_members').update({status:'approved'}).eq('family_id',family.id).eq('user_id',id);if(error)throw error;await reloadCloud();render();toast('تم اعتماد العضو')}catch(e){toast(e.message,true)}}
async function reject(id){try{let{error}=await sb.from('family_members').delete().eq('family_id',family.id).eq('user_id',id);if(error)throw error;await reloadCloud();render();toast('تم رفض طلب الانضمام')}catch(e){toast(e.message,true)}}
async function logout(){if(!sb)return;await sb.auth.signOut();session=null;membership=null;family=null;people=[];posts=[];if(realtime){sb.removeChannel(realtime);realtime=null}if(pollTimer){clearInterval(pollTimer);pollTimer=null}render();toast('تم تسجيل الخروج')}
function localMode(){mode='local';family=null;membership=null;people=clone(local.people||[]);posts=clone(local.posts||[]);treeView.fit=false;render();toast('وضع الجهاز المحلي مفعّل')}
async function uploadLocal(){if(!isAdmin())return toast('الرفع متاح لمدير الشجرة فقط',true);let copy=local.people||[];if(!copy.length)return toast('لا توجد أسماء محلية للنقل');if(!confirm(`سيُرفع ${copy.length} اسمًا من الجهاز إلى شجرة العائلة المشتركة. قد تكون بينها أسماء تجريبية؛ تأكد قبل المتابعة. هل توافق؟`))return;try{let existing=new Set(people.map(p=>p.id));for(const p of copy){if(!isValidId(p.id))continue;if(existing.has(p.id))continue;await writePerson({...p,id:p.id})}for(const p of local.posts||[]){if(!isValidId(p.id)||posts.some(x=>x.id===p.id))continue;let{error}=await sb.from('family_posts').insert({id:p.id,family_id:family.id,type:p.type||'message',body:p.body,image:p.image||'',person_id:p.person_id||null,memory_date:p.memory_date||'',author_name:currentName(),author_id:session.user.id});if(error)throw error}await reloadCloud();treeView.fit=false;render();toast('اكتمل نقل البيانات غير المكررة')}catch(e){toast('توقف النقل: '+e.message,true)}}
function goto(tab){currentTab=tab;treeView.query='';if(tab==='tree')treeView.fit=false;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
function switchMode(){if(mode==='local')cloudSettings();else{modal('حساب المزامنة',`<p>أنت متصل بشجرة العائلة. يمكنك تسجيل الخروج أو الانتقال إلى بيانات الجهاز المحلية.</p>`,`<button class="btn outline" onclick="app.localMode();app.closeModal()">نسخة الجهاز</button><button class="btn" onclick="app.closeModal();app.goto('admin')">إدارة الحساب</button>`)}}
window.app={goto,profile,personForm,closeModal,savePerson,deletePerson,renameFamily,treeSearch,fitTree,changeFont,adjustFont,fontSettings,setTreeStyle,zoom:f=>zoomTree(f),filterGender:s=>{listFilter=s;renderPeople()},filterName:s=>{treeView.query=s;renderPeople()},exportSVG:svgExport,publish,deletePost,exportJSON,importJSON,resetTree,cloudSettings,connectCloud,loginTab:s=>{loginTab=s;renderAccount()},authSubmit,showCreate,showJoin,createFamily,joinFamily,checkMembership,approve,reject,logout,localMode,uploadLocal,copyCode,switchMode};
$('topAccount').addEventListener('click',switchMode);
window.addEventListener('focus',()=>{if(mode==='cloud'&&session)refreshBackground()});
// النسخة المحلية تعمل فورًا، دون تسجيل أو خدمات خارجية.
people=clone(local.people||[]);posts=clone(local.posts||[]);render();
window.jozornaCloudReady=()=>{if(config.url&&config.key&&window.supabase?.createClient&&!sb){try{sb=window.supabase.createClient(config.url,config.key);mode='cloud';cloudEntry()}catch(e){console.warn('تعذر بدء المزامنة:',e)}}};window.jozornaCloudReady();
})();
</script>
